name: prepsarthi
description: PrepSarthi – JEE, NEET & Class 12 AI Study Planner
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_vertexai: ^1.0.2
  # ✅ ADDED: Crashlytics for production error monitoring
  firebase_crashlytics: ^4.1.3

  # Payments
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0+10

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  confetti: ^0.7.0
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Utils
  collection: ^1.18.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  crypto: ^3.0.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12

dependency_overrides:
  isar_flutter_libs:
    path: third_party/isar_flutter_libs

flutter:
  uses-material-design: true
  assets:
    - assets/syllabus/jee_main_2026.json
    - assets/syllabus/jee_advanced_2026.json
    - assets/syllabus/neet_ug_2026.json
    - assets/syllabus/class12_boards_2026.json
    - assets/quotes/motivational_quotes.json
    - assets/images/
