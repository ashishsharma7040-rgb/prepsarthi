## .github/workflows/build-debug-apk.yml
##
## Builds a Debug APK for PrepSarthi.
##
## ── Required GitHub Secrets ───────────────────────────────────────────────────
##
##   GOOGLE_SERVICES_JSON_B64
##     Base64-encoded android/app/google-services.json
##
##   DEBUG_KEYSTORE_BASE64
##     Base64-encoded prepsarthi-debug.keystore (fixed keystore — SHA never changes)
##
## ─────────────────────────────────────────────────────────────────────────────

name: Build Debug APK

# Opt into Node.js 24 — fixes deprecation warning for checkout/setup-java/upload-artifact
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build PrepSarthi Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter (stable) ──────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ── 4. Restore fixed debug keystore (SHA never changes between builds) ───
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          echo "✅ Fixed debug keystore restored — SHA is always FA:ED:59:C2:3B:EA:A7:0B:19:3D:FC:C3:3C:86:97:8D:4F:E5:F7:C0"

      # ── 5. Firebase google-services.json ─────────────────────────────────────
      - name: Install Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "❌  Missing secret: GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.prepsarthi.app"' android/app/google-services.json; then
            echo "❌  google-services.json does not contain package com.prepsarthi.app"
            exit 1
          fi
          echo "✅  google-services.json installed and verified"

      # ── 6. Verify Firebase config ─────────────────────────────────────────────
      - name: Verify Firebase Android config
        run: python3 scripts/firebase/verify_google_services.py android/app/google-services.json
        continue-on-error: true

      # ── 7. Flutter dependencies ───────────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ── 8. Remove stale files ─────────────────────────────────────────────────
      - name: Remove stale files
        run: |
          rm -f lib/presentation/screens/mistake_notebook_screen.dart
          echo "Stale files removed"

      # ── 9. Clean build cache ──────────────────────────────────────────────────
      - name: Clean build cache
        run: |
          flutter clean
          dart run build_runner clean || true
          echo "Build cache cleared"

      # ── 10. Generate Isar / build_runner files ────────────────────────────────
      - name: Generate Isar / build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      # ── 11. Analyze ───────────────────────────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── 12. Test ──────────────────────────────────────────────────────────────
      - name: Flutter test
        run: flutter test

      # ── 13. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 14. Verify APK exists ─────────────────────────────────────────────────
      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          ls -lh "$APK_PATH"
          echo "✅  Debug APK built successfully"

      # ── 15. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prepsarthi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
