name: Build Debug APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build PrepSarthi Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ── Restore fixed debug keystore ──────────────────────────────────────────
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "❌ MISSING SECRET: DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          ACTUAL_SHA=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android 2>&1 | grep "SHA1:" | tr -d ' \t')
          echo "✅ Keystore restored. $ACTUAL_SHA"

      # ── Write key.properties using dynamic $HOME path ─────────────────────────
      # FIX: previously hardcoded /root/ — now uses $HOME which resolves
      # correctly to /home/runner on GitHub Actions
      - name: Write key.properties for signing
        run: |
          cat > android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/debug.keystore
          EOF
          echo "✅ key.properties written with path: $HOME/.android/debug.keystore"

      # ── Firebase google-services.json ─────────────────────────────────────────
      - name: Install Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "❌ MISSING SECRET: GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json installed"

      - name: Verify Firebase Android config
        run: python3 scripts/firebase/verify_google_services.py android/app/google-services.json
        continue-on-error: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove stale files
        run: |
          rm -f lib/presentation/screens/mistake_notebook_screen.dart
          # Dead duplicate created during manual upload — the live file is at
          # lib/presentation/screens/mistakes/ (imported by app_router). This
          # stray copy has broken relative imports and fails analyze.
          rm -f lib/presentation/mistakes/mistake_notebook_screen.dart
          echo "✅ stale/duplicate files removed"

      - name: Clean build cache
        run: |
          flutter clean
          dart run build_runner clean || true

      - name: Generate Isar / build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Part 1 (chapterKey identity) codegen guard ────────────────────────────
      # The Stage-1 fixes add chapterKey/syllabusSource fields whose Isar query
      # extensions (chapterKeyEqualTo, syllabusSourceEqualTo) only exist AFTER
      # codegen. If generation silently produced stale output, the build would
      # fail later with a confusing error — this surfaces it immediately.
      - name: Verify chapterKey codegen
        run: |
          if ! grep -q "chapterKeyEqualTo" lib/data/local/isar/schemas/chapter_schema.g.dart; then
            echo "❌ build_runner did not generate chapterKey query methods."
            echo "   Check that the 5 modified schemas regenerated cleanly."
            exit 1
          fi
          echo "✅ chapterKey codegen verified"

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        run: flutter test

      # Run the Stage-1 regression gate on its own too, so a failure here is
      # unambiguous in the logs (identity / streak / mastery / exam-date).
      - name: Stage-1 regression gate
        run: flutter test test/stage1_regression_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          echo "✅ Debug APK built successfully"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prepsarthi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
