name: Build Debug APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build PrepSarthi Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ''
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ── CRITICAL: Restore fixed debug keystore ───────────────────────────────
      # If this secret is missing the build will FAIL loudly here
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "❌ MISSING SECRET: DEBUG_KEYSTORE_BASE64"
            echo "Go to GitHub repo → Settings → Secrets → Actions → New secret"
            echo "Name: DEBUG_KEYSTORE_BASE64"
            echo "Value: contents of keystore-base64.txt file"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          VERIFY=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep "SHA1:")
          echo "✅ Keystore restored. SHA1: $VERIFY"

      # ── Firebase google-services.json ────────────────────────────────────────
      - name: Install Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "❌ MISSING SECRET: GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json installed"

      - name: Verify Firebase Android config
        run: python3 scripts/firebase/verify_google_services.py android/app/google-services.json
        continue-on-error: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove stale files
        run: |
          rm -f lib/presentation/screens/mistake_notebook_screen.dart

      - name: Clean build cache
        run: |
          flutter clean
          dart run build_runner clean || true

      - name: Generate Isar / build_runner files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK and print SHA
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          ls -lh "$APK_PATH"
          echo "✅ Debug APK built successfully"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prepsarthi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
